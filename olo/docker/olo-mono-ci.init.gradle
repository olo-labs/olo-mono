// Docker CI: resolve published olo-spi / olo-annotation from olo-mono/build/repo.
allprojects { p ->
    repositories {
        File directory = p.rootProject.projectDir
        File repo = null
        while (directory != null) {
            if (new File(directory, 'olo-spi').isDirectory() && new File(directory, 'olo-annotation').isDirectory()) {
                repo = new File(directory, 'build/repo')
                break
            }
            directory = directory.parentFile
        }
        if (repo != null) {
            maven {
                name = 'oloMono'
                url = repo
            }
        }
        mavenCentral()
        mavenLocal()
    }
}
