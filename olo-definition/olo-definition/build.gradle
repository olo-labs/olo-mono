plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Serializable workflow graph definitions for the Open LLM Orchestrator (OLO)'

tasks.register('generateFreshConfiguration', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.olo.definition.fresh.FreshWorkflowGenerator'
    args layout.buildDirectory.dir('fresh-workflows').get().asFile.absolutePath
    doFirst {
        def output = layout.buildDirectory.dir('fresh-workflows').get().asFile.canonicalFile
        def buildRoot = layout.buildDirectory.get().asFile.canonicalFile
        if (!output.path.startsWith(buildRoot.path + File.separator)) {
            throw new GradleException('Fresh workflow staging must stay inside the build directory')
        }
        delete output
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

apply from: rootProject.file('../gradle/olo-mono-repo.gradle')
configureOloMonoPublishing(project)
configureOloMonoRepositories(repositories)

dependencies {
    api 'org.olo:olo-spi:0.1.0-SNAPSHOT'
    api 'org.olo:olo-annotation:0.1.0-SNAPSHOT'
    // Parameter catalog tests use the actual generated node metadata.
    testImplementation 'org.olo:olo-core-nodes:0.1.0-SNAPSHOT'
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.named('javadoc', Javadoc) {
    options.addBooleanOption('Xdoclint:none', true)
    options.quiet()
}

jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

// Tests validate source fixtures; generation is an explicit staging operation.
tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = rootProject.projectDir
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'olo-definition'
        }
    }
}
