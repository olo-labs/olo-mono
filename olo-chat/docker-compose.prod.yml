# Production: frontend proxies to the olo backend container (same Docker network).
# Usage: docker compose -f docker-compose.prod.yml up --build -d

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLO_BACKEND_URL: ${OLO_BACKEND_URL:-http://olo:7080}
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - olo-net

networks:
  olo-net:
    external: true
    name: olo-net
