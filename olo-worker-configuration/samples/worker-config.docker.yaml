id: "docker-worker"
name: "OLO Worker (docker)"
server:
  host: "0.0.0.0"
  port: 8080
workflowDefinitions:
  scanFolder: "/app/olo-configuration"
  recursive: true
temporal:
  namespace: "default"
  target: "temporal:7233"
cache:
  enabled: true
  host: "redis"
  port: 6379
input:
  maxLocalMessageSize: 50
metadata:
  environment: "docker"
  oloApiBaseUrl: "http://olo:7080"
# Platform history/RAG require user-bound Gateway credentials; no local fallback.
toolgate:
  enabled: true
  mcpUrl: "${OLO_TOOLGATE_MCP_URL}"
  userCredentialsUrl: "${OLO_TOOLGATE_USER_CREDENTIALS_URL}"
  delegatedAgents: true
  timeoutMs: 20000
  maxToolRounds: 8
  reservedPrincipals: ["olo-platform-service"]
  agentMappings: []
