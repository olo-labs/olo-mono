plugins { id 'base' }
ext.toolgateVersion = System.getenv('TOOLGATE_VERSION') ?: '1.0.0-dev.1'
subprojects {
    apply plugin: 'java-library'
    group = 'org.olo.knowledge'
    version = '0.1.0-SNAPSHOT'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    repositories {
        maven { url = uri(new File(System.getenv('TOOLGATE_SOURCE') ?: rootProject.file('../../olo-toolgate').absolutePath, 'build/sdk-repo')) }
        maven { url = uri(new File(System.getenv('TOOLGATE_SOURCE') ?: rootProject.file('../../olo-toolgate').absolutePath, '.dev/maven')) }
        mavenCentral()
    }
    dependencies {
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}

/* Record the actual published ToolGate JARs used by the application JVM fixtures. */
subprojects {
    tasks.register('toolgateArtifactEvidence') {
        inputs.files(configurations.runtimeClasspath)
        def evidence = layout.buildDirectory.file('qualification/toolgate-artifacts.json')
        outputs.file(evidence)
        doLast {
            def hashes = [:]
            configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def id = artifact.moduleVersion.id
                if (id.group == 'io.github.olo-labs' &&
                    id.name in ['toolgate-service-authorization', 'toolgate-contracts']) {
                    if (id.version != rootProject.ext.toolgateVersion) {
                        throw new GradleException('Unexpected ToolGate runtime artifact version')
                    }
                    hashes[id.name] = java.security.MessageDigest.getInstance('SHA-256')
                        .digest(artifact.file.bytes).encodeHex().toString()
                }
            }
            if (hashes.size() != 2) throw new GradleException('Both ToolGate runtime artifacts are required')
            def target = evidence.get().asFile
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.toJson(hashes)
        }
    }
    tasks.named('test').configure { dependsOn tasks.named('toolgateArtifactEvidence') }
}
