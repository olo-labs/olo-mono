# Dev AI stack - audio: dedicated LocalAI speech service (Whisper).
# Uses all NVIDIA GPUs. Requires nvidia-container-toolkit.
services:
  openai-oss-audio:
    image: localai/localai:latest-gpu-nvidia-cuda-12
    container_name: olo-openai-oss-audio
    restart: unless-stopped
    ports:
      - "48082:8080"
    environment:
      - THREADS=4
      - DEBUG=true
    volumes:
      - olo-dev-localai-audio-models:/models
      - olo-dev-localai-audio-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - olo-net


networks:
  olo-net:
    external: true
    name: olo-net

volumes:
  olo-dev-localai-audio-models:
  olo-dev-localai-audio-cache:
