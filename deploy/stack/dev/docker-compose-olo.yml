services:
  olo:
    image: ololab/olo:latest
    container_name: olo
    restart: unless-stopped
    ports:
      - "47080:7080"
    environment:
      SERVER_PORT: "7080"
      OLO_VERSION: "v1.0.0-Dev"
      OLO_SWAGGER_UI_ENABLED: "true"
      OLO_CACHE_HOST: redis
      OLO_CACHE_PORT: "6379"
      OLO_CACHE_DATABASE: "0"
      OLO_TEMPORAL_TARGET: temporal:7233
      # Temporal payload protection (OLO M5.2). This dev stack keeps history readable; production mounts a key ring
      # and sets OLO_PAYLOAD_KEYS_FILE instead.
      OLO_PAYLOAD_PROTECTION: ${OLO_PAYLOAD_PROTECTION:-disabled-for-development}
      OLO_UI_TENANT_DISPLAY_NAME: "Default"
      OLO_UI_USER_DISPLAY_NAME: "Public"
      # URL workers use to POST run events. Host-run worker (gradlew/IDE): localhost:47080.
      # Override when worker runs in Docker on olo-net: OLO_CHAT_CALLBACK_BASE_URL=http://olo:7080
      OLO_CHAT_CALLBACK_BASE_URL: ${OLO_CHAT_CALLBACK_BASE_URL:-http://olo:7080}
      # Verified JWT identity is required by the backend; .env values must be forwarded explicitly.
      OLO_SECURITY_ISSUER: ${OLO_SECURITY_ISSUER:-http://localhost:48080/realms/olo-dev}
      OLO_SECURITY_AUDIENCE: ${OLO_SECURITY_AUDIENCE:-olo-api}
      OLO_SECURITY_JWK_SET_URI: ${OLO_SECURITY_JWK_SET_URI:-http://keycloak:8080/realms/olo-dev/protocol/openid-connect/certs}
      OLO_SECURITY_BOOTSTRAPMEMBERSHIPS_0_ISSUER: ${OLO_SECURITY_ISSUER:-http://localhost:48080/realms/olo-dev}
      OLO_SECURITY_BOOTSTRAPMEMBERSHIPS_0_SUBJECT: "5e6c15f2-2771-426b-b463-c0b932ef85a1"
      OLO_SECURITY_BOOTSTRAPMEMBERSHIPS_0_TENANTS_0: default
      OLO_CALLBACK_KEY_ID: ${OLO_CALLBACK_KEY_ID:-}
      OLO_CALLBACK_KEY: ${OLO_CALLBACK_KEY:-}
      # Must match Dockerfile WORKDIR (/app) and image default OLO_CONFIGURATION_DIR.
      OLO_CHAT_PIPELINE: governed-chat
      OLO_TOOLGATE_GATEWAY_URL: ${OLO_TOOLGATE_MCP_URL:?Provision the governed ToolGate stack first}
      OLO_TOOLGATE_CREDENTIALS_ENABLED: "true"
      OLO_TOOLGATE_CREDENTIALS_CONTROL_URL: ${OLO_TOOLGATE_CONTROL_URL:?ToolGate Control HTTPS URL is required}
      OLO_CONFIGURATION_DIR: /app/olo-runtime-workflows
    volumes:
      # Regional workflow presets (default/*.json). Default: dev/configuration/olo-configuration.
      # Override to bind directly from a monorepo checkout, e.g.:
      #   OLO_CONFIGURATION_SOURCE=../../olo-definition/olo-configuration
      #   OLO_CONFIGURATION_SOURCE=../../olo-labs/olo/olo-configuration
      - ${OLO_RUNTIME_WORKFLOW_SOURCE:-../../../olo-ui/olo-be/docker/runtime-configuration}:/app/olo-runtime-workflows:ro
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_started
    networks:
      - olo-net

  olo-ui:
    image: ololab/olo-ui:latest
    container_name: olo-ui
    restart: unless-stopped
    ports:
      - "43001:80"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Re-enable after pulling an olo-ui image built without RedisConfig bean conflict.
      # OLO_REDIS_ENABLED: "true"
      OLO_TENANT_IDS: olo:tenants
      OLO_CONFIGURATION_DIRECTORY: /app/olo-configuration/current-active
      OLO_CATALOG_DIRECTORY: /app/catalog
      OLO_RUNTIME_BASE_URL: http://olo:7080
    volumes:
      - ${OLO_UI_NGINX_CONFIG_SOURCE:-./configuration/olo-ui/nginx-default.conf}:/etc/nginx/http.d/default.conf:ro
      - ${OLO_CONFIGURATION_SOURCE:-./configuration/olo-configuration}:/app/olo-configuration
      - ${OLO_CATALOG_SOURCE:-./configuration/olo-catalog}:/app/catalog
    depends_on:
      - redis
      - olo
    networks:
      - olo-net

  olo-chat:
    image: ololab/olo-chat:latest
    container_name: olo-chat
    restart: unless-stopped
    ports:
      - "43000:80"
    environment:
      OLO_BACKEND_URL: http://olo:7080
    depends_on:
      - olo
    networks:
      - olo-net

  olo-worker:
    image: ololab/olo-worker:latest
    container_name: olo-worker
    restart: unless-stopped
    environment:
      OLO_WORKER_CONFIG_PATH: /app/worker/config/worker-config.yaml
      OLO_CALLBACK_KEY_ID: ${OLO_CALLBACK_KEY_ID:-}
      OLO_CALLBACK_KEY: ${OLO_CALLBACK_KEY:-}
      # Temporal payload protection (OLO M5.2). This dev stack keeps history readable; production mounts a key ring
      # and sets OLO_PAYLOAD_KEYS_FILE instead.
      OLO_PAYLOAD_PROTECTION: ${OLO_PAYLOAD_PROTECTION:-disabled-for-development}
      OLO_TOOLGATE_MCP_URL: ${OLO_TOOLGATE_MCP_URL:?ToolGate MCP URL is required}
      OLO_TOOLGATE_USER_CREDENTIALS_URL: ${OLO_TOOLGATE_USER_CREDENTIALS_URL:-http://olo:7080}
      OLO_LLM_BASE_URL: http://ollama:11434
      OLO_CHAT_CALLBACK_BASE_URL: http://olo:7080
      OLO_LOG_DIRECTORY: /app/logs
    depends_on:
      - olo
      - temporal
      - redis
    volumes:
      - ${OLO_RUNTIME_WORKFLOW_SOURCE:-../../../olo-ui/olo-be/docker/runtime-configuration}:/app/olo-runtime-workflows:ro
      - ${OLO_WORKER_CONFIG_SOURCE:-./configuration/olo-worker/config}:/app/worker/config:ro
      - ${OLO_WORKER_LOG_SOURCE:-./configuration/olo-worker/logs}:/app/logs
    networks:
      - olo-net

networks:
  olo-net:
    external: true
    name: olo-net
