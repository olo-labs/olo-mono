services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: olo-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:48080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OLO_DEV_ADMIN_PASSWORD:?Run scripts/init-identity.ps1 or scripts/init-identity.sh first}
      OLO_DEV_USER_PASSWORD: ${OLO_DEV_USER_PASSWORD:?Run scripts/init-identity.ps1 or scripts/init-identity.sh first}
      KC_HOSTNAME: ${OLO_DEV_IDP_URL:-http://localhost:48080}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - olo-keycloak-data:/opt/keycloak/data
      - ./configuration/keycloak/olo-dev-realm.json:/opt/keycloak/data/import/olo-dev-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks:
      - olo-net
volumes:
  olo-keycloak-data:
