name: Build and publish application images
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      push:
        description: Publish images to registries
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: olo
            context: .
            file: olo/Dockerfile
            version: olo/build.gradle
          - image: olo-worker
            context: .
            file: olo-worker/Dockerfile
            version: olo-worker/build.gradle
          - image: olo-chat
            context: olo-chat
            file: olo-chat/Dockerfile
            version: olo-chat/package.json
          - image: olo-ui
            context: olo-ui
            file: olo-ui/Dockerfile
            version: olo-ui/olo-be/build.gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Normalize executable scripts
        run: |
          find . -name gradlew -o -name '*.sh' | while read -r script; do
            sed -i 's/\r$//' "$script"
            chmod +x "$script"
          done
      - name: Prepare studio catalog and workflows
        if: matrix.image == 'olo-ui'
        run: bash scripts/prepare-studio.sh
      - name: Resolve image version
        id: version
        env:
          VERSION_FILE: ${{ matrix.version }}
        run: |
          VERSION=$(node -e "const fs=require('fs');const s=fs.readFileSync(process.env.VERSION_FILE,'utf8');console.log(process.env.VERSION_FILE.endsWith('.json')?JSON.parse(s).version:s.match(/version\s*=\s*['\"]([^'\"]+)/)[1])")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }},enable=${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
